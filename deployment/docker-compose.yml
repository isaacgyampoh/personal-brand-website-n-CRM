# Production / staging stack for Contabo. Joins the EXISTING shared reverse-proxy
# network (Caddy) instead of starting another proxy. Adjust `proxy` network name
# to match the server. Secrets come from an .env file that is never committed.
name: brand-platform

services:
  web:
    image: ${IMAGE_PREFIX:-brand-platform}:web-${RELEASE:-latest}
    build: { context: .., target: web }
    env_file: ${ENV_FILE:-.env.production}
    restart: unless-stopped
    depends_on:
      worker: { condition: service_started }
    networks: [proxy, internal]
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 768M }
    logging: { driver: json-file, options: { max-size: "10m", max-file: "5" } }

  worker:
    image: ${IMAGE_PREFIX:-brand-platform}:worker-${RELEASE:-latest}
    build: { context: .., target: worker }
    env_file: ${ENV_FILE:-.env.production}
    environment:
      INTERNAL_APP_URL: http://web:3000
    restart: unless-stopped
    networks: [internal]
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 384M }
    logging: { driver: json-file, options: { max-size: "10m", max-file: "5" } }

networks:
  internal: {}
  proxy:
    external: true
    name: ${PROXY_NETWORK:-proxy}
